# Image build pipeline for git.mooinglemur.com/ionium-ap/Archipelago-lobby
#
# Builds and pushes the Docker images other ionium-ap projects (and the lobby
# itself) consume:
#   - apwm           : the index management Rust binary
#   - apdiff-viewer  : PR diff rendering service
#   - ap-worker      : Python harness (self_check.py, checker.py, generation, etc.)
#   - ap-lobby       : the lobby itself
#   - community-ap-tools
#
# Pattern for each Rust binary: a cargo job builds the binary in a rust:slim
# image (with the workspace cache), stages it as `build-result` next to its
# Dockerfile, then an image job runs `buildah build` against that staged context.
# This mirrors the build-result convention the Dockerfiles already expect from
# the legacy Taskcluster setup, so the Dockerfiles don't need to change.
#
# The ap-worker image is multi-stage and self-contained — no separate cargo
# stage needed.
#
# Images are built on every branch and always pushed as :sha-<short sha>. The
# moving tags are branch-gated: main pushes :latest, ionium-dev pushes :dev,
# and every other branch pushes no moving tag at all.

# Only run on the canonical GitLab instance. If this YAML ends up on a fork,
# a different instance, or a mirror elsewhere, no pipeline is created at all.
workflow:
  rules:
    - if: '$CI_SERVER_HOST == "git.mooinglemur.com"'

default:
  interruptible: true

stages:
  - rust-build
  - image

# ---- shared anchors ----

.rust-cache: &rust-cache
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - target/
      - .cargo/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo

.cargo-build: &cargo-build
  stage: rust-build
  image: rust:1.92-trixie
  tags:
    - docker
    - k8s
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev git ca-certificates mold
    - rm -rf /var/lib/apt/lists/*
  <<: *rust-cache

# Buildah, not dind: nothing untrusted is built here, so this needs a builder rather than an
# isolation boundary. Storage setup mirrors Archipelago-index-ci's working pipeline.
.buildah-build: &buildah-build
  stage: image
  image: quay.io/buildah/stable
  tags:
    - docker
    - k8s
  variables:
    CONTAINERS_STORAGE_CONF: /tmp/storage.conf
  before_script:
    # Native kernel overlay. The image's storage.conf sets mount_program = fuse-overlayfs, but
    # FUSE needs CAP_SYS_ADMIN, which this tier lacks; /dev/fuse does not help, it fails EPERM
    # at mount time. Dropping mount_program lets buildah mount overlay directly.
    #
    # Must be a config file via $CONTAINERS_STORAGE_CONF, not `--storage-driver overlay`:
    # containers-storage persists driver options into the graphroot on first use, so the flag
    # inherits mount_program anyway depending on what touched the store first.
    #
    # graphroot stays on the container filesystem (node NVMe), not the build dir (emptyDir).
    - |
      cat > "$CONTAINERS_STORAGE_CONF" <<'CONF'
      [storage]
      driver = "overlay"
      runroot = "/var/run/containers/storage"
      graphroot = "/var/lib/containers/storage"
      [storage.options.overlay]
      mountopt = "nodev"
      CONF
    # Build output says nothing about storage. GraphOptions shows whether this config won:
    # overlay.mountopt=nodev alone is right, a mount_program entry means it didn't. A fall back
    # to vfs is slow, not broken.
    - buildah info
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Which moving tag (if any) this branch owns. Everything else gets only the
    # immutable sha- tag.
    - |
      case "$CI_COMMIT_BRANCH" in
        main)        MOVING_TAG=latest ;;
        ionium-dev)  MOVING_TAG=dev ;;
        *)           MOVING_TAG= ;;
      esac
      echo "branch=$CI_COMMIT_BRANCH moving tag=${MOVING_TAG:-<none>}"
      # push_image <image> -- pushes :sha-<short sha> plus the branch's moving tag.
      # Tagged after the build so both names are guaranteed to be the same image.
      push_image() {
        buildah push "$1:sha-$CI_COMMIT_SHORT_SHA"
        if [ -n "$MOVING_TAG" ]; then
          buildah tag "$1:sha-$CI_COMMIT_SHORT_SHA" "$1:$MOVING_TAG"
          buildah push "$1:$MOVING_TAG"
        fi
      }

# ---- rust-build stage ----

build-apwm:
  <<: *cargo-build
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "apwm/**/*", "taskcluster/docker/apwm/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cargo build --release --bin apwm --features cli
    - mkdir -p artifacts/apwm
    - cp target/release/apwm artifacts/apwm/build-result
  artifacts:
    paths: [artifacts/apwm/]
    expire_in: 1 day

build-apdiff-viewer:
  <<: *cargo-build
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "apwm/**/*", "apdiff-viewer/**/*", "taskcluster/docker/apdiff-viewer/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cargo build --release --bin apdiff-viewer
    - mkdir -p artifacts/apdiff-viewer
    - cp target/release/apdiff-viewer artifacts/apdiff-viewer/build-result
  artifacts:
    paths: [artifacts/apdiff-viewer/]
    expire_in: 1 day

build-ap-lobby:
  <<: *cargo-build
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "wq/**/*", "apwm/**/*", "lobby/**/*", "taskcluster/docker/ap-lobby/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cargo build --release --bin ap-lobby
    - mkdir -p artifacts/ap-lobby
    - cp target/release/ap-lobby artifacts/ap-lobby/build-result
  artifacts:
    paths: [artifacts/ap-lobby/]
    expire_in: 1 day

build-community-ap-tools:
  <<: *cargo-build
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "community-ap-tools/**/*", "taskcluster/docker/community-ap-tools/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cargo build --release --bin community-ap-tools
    - mkdir -p artifacts/community-ap-tools
    - cp target/release/community-ap-tools artifacts/community-ap-tools/build-result
  artifacts:
    paths: [artifacts/community-ap-tools/]
    expire_in: 1 day

# ---- image stage ----

image-apwm:
  <<: *buildah-build
  needs: [build-apwm]
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "apwm/**/*", "taskcluster/docker/apwm/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/apwm"
    - cp artifacts/apwm/build-result taskcluster/docker/apwm/build-result
    - buildah build
        -t "$IMAGE:sha-$CI_COMMIT_SHORT_SHA"
        -f taskcluster/docker/apwm/Dockerfile
        taskcluster/docker/apwm
    - push_image "$IMAGE"

image-apdiff-viewer:
  <<: *buildah-build
  needs: [build-apdiff-viewer]
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "apwm/**/*", "apdiff-viewer/**/*", "taskcluster/docker/apdiff-viewer/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/apdiff-viewer"
    - cp artifacts/apdiff-viewer/build-result taskcluster/docker/apdiff-viewer/build-result
    - buildah build
        -t "$IMAGE:sha-$CI_COMMIT_SHORT_SHA"
        -f taskcluster/docker/apdiff-viewer/Dockerfile
        taskcluster/docker/apdiff-viewer
    - push_image "$IMAGE"

image-ap-lobby:
  <<: *buildah-build
  needs: [build-ap-lobby]
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "wq/**/*", "apwm/**/*", "lobby/**/*", "taskcluster/docker/ap-lobby/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/ap-lobby"
    - cp artifacts/ap-lobby/build-result taskcluster/docker/ap-lobby/build-result
    - buildah build
        -t "$IMAGE:sha-$CI_COMMIT_SHORT_SHA"
        -f taskcluster/docker/ap-lobby/Dockerfile
        taskcluster/docker/ap-lobby
    - push_image "$IMAGE"

image-community-ap-tools:
  <<: *buildah-build
  needs: [build-community-ap-tools]
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes: ["Cargo.*", "common/**/*", "community-ap-tools/**/*", "taskcluster/docker/community-ap-tools/**/*"]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/community-ap-tools"
    - cp artifacts/community-ap-tools/build-result taskcluster/docker/community-ap-tools/build-result
    - buildah build
        -t "$IMAGE:sha-$CI_COMMIT_SHORT_SHA"
        -f taskcluster/docker/community-ap-tools/Dockerfile
        taskcluster/docker/community-ap-tools
    - push_image "$IMAGE"

# ap-worker is built from the repo root because its Dockerfile COPYs
# both ./ap-worker (the Python harness) and the Dockerfile-adjacent
# setup.sh / prepare_worlds.sh / host.yaml.
image-ap-worker:
  <<: *buildah-build
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - "ap-worker/**/*"
        - "taskcluster/docker/ap-worker/**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/ap-worker"
    - buildah build
        --build-arg SRC=.
        --build-arg DOCKER_SRC=taskcluster/docker/ap-worker
        -t "$IMAGE:sha-$CI_COMMIT_SHORT_SHA"
        -f taskcluster/docker/ap-worker/Dockerfile
        .
    - push_image "$IMAGE"
