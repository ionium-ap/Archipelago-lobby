# A custom world whose every release needs 0.6.8. It has nothing to put in [versions], so it has
# to be disabled at the top level or old lobbies fail on a world with no known release.
name = "New Custom World"
default_url = "https://example.invalid/new_custom-{{version}}/new_custom.apworld"
disabled = true

[releases]
"1.0.0" = { min_ap_version = "0.6.8" }

[base.">=0.6.8"]
disabled = false
